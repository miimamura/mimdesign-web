# GitHub Pages（Jekyll）のビルド設定。
#
# このリポジトリには、サイト本体のほかに内部ドキュメントと元画像が入っている。
# どちらも配信する必要がなく、docs/ は社外に出る想定で書いていないため、
# ビルド出力から除外する。ここから外すと即座に公開 URL が生える点に注意。
exclude:
  - docs               # 設計プラン・画像インベントリ等（守秘の検討内容を含む）
  - assets/images/gallery  # 支給画像の元データ 29MB。WebP 化済みのものを配信している
  - README.md          # リポジトリの説明。サイトの一部ではない
